<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sync document into Zotero">
  <!-- Original artwork for dsh-zotero-sync: a document rising into a library stack. -->
  <defs>
    <linearGradient id="ztspine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e04b3f"/>
      <stop offset="1" stop-color="#b3271f"/>
    </linearGradient>
  </defs>

  <!-- library stack -->
  <rect x="30" y="10" width="26" height="7" rx="3.2" fill="#3f5470"/>
  <rect x="30" y="20" width="26" height="7" rx="3.2" fill="#5b7391"/>
  <rect x="30" y="44" width="26" height="7" rx="3.2" fill="#5b7391"/>
  <rect x="30" y="54" width="26" height="7" rx="3.2" fill="#3f5470"/>

  <!-- document -->
  <path d="M8 16h18l8 8v24a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3z" fill="#f6f7f9" stroke="#c9ced8" stroke-width="1.4"/>
  <path d="M26 16l8 8h-8z" fill="#d8dde6"/>
  <rect x="13" y="30" width="14" height="2.4" rx="1.2" fill="#9aa4b4"/>
  <rect x="13" y="36" width="17" height="2.4" rx="1.2" fill="#9aa4b4"/>
  <rect x="13" y="42" width="11" height="2.4" rx="1.2" fill="#9aa4b4"/>

  <!-- transfer arrow -->
  <path d="M27.5 26.5h6.2" stroke="url(#ztspine)" stroke-width="4" stroke-linecap="round"/>
  <path d="M33 21.5l6.5 5-6.5 5z" fill="url(#ztspine)"/>
</svg>
